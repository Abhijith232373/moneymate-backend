server:
  port: "8080"
  environment: "development"

services:
  auth_addr: "localhost:8081"           
  merch_addr: "merchant:9092"          

redis:
  address: "localhost:6379"
  password: ""
  db: 0

rate_limiting:
  enabled: true
  max_requests: 100
  window_seconds: 60

cors:
  allow_origins: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
  allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allow_headers: "Authorization,Content-Type,Idempotency-Key,X-Transaction-Token,X-Transaction-Id,X-Device-Id"

tracing:
  enabled: false
  collector_url: "localhost:4317"