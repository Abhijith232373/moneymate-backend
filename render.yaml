services:
  # ── Internal Redis Cache ──
  - type: keyvalue
    name: moneymate-redis
    region: singapore
    plan: free
    ipAllowList: []

  # ── Auth Service ──
  - type: web
    name: auth-service
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./services/auth/Dockerfile
    envVars:
      - key: PORT
        value: "8081"
      - key: HTTP_PORT
        value: "8081"
      - key: GRPC_PORT
        value: "9091"
      - key: ENVIRONMENT
        value: "production"
      - key: CONFIG_PATH
        value: "/app/config/config.yaml"
      - key: POSTGRES_HOST
        value: "dpg-d9hk7pl8nd3s73d7cji0-a"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        value: "superuser"
      - key: REDIS_ADDR
        value: "red-d9i4417avr4c73a448l0:6379"
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: "moneymate2026@gmail.com"
      - key: EMAIL_FROM_NAME
        value: "MoneyMate"

  # ── Merchant Service ──
  - type: web
    name: merchant-service
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./services/merchant/Dockerfile
    envVars:
      - key: PORT
        value: "9092"
      - key: ENVIRONMENT
        value: "production"
      - key: CONFIG_PATH
        value: "/app/config/config.yaml"
      - key: POSTGRES_HOST
        value: "dpg-d9hk7pl8nd3s73d7cji0-a"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        value: "superuser"
      - key: DB_POOL_MAX_CONNS
        value: "10"
      - key: POSTGRES_MAX_CONNS
        value: "10"
      - key: POOL_MAX_CONNS
        value: "10"
      - key: POSTGRES_PASSWORD
        sync: false

  # ── API Gateway (Public Ingress) ──
  - type: web
    name: api-gateway
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./services/gateway/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: "production"
      - key: CONFIG_PATH
        value: "/app/config/config.yaml"
      - key: SERVICES_AUTH_ADDR
        value: "auth-service:9091"
      - key: AUTH_SERVICE_URL
        value: "auth-service:9091"
      - key: MERCHANT_SERVICE_URL
        value: "merchant-service:9092"
      - key: REDIS_ADDRESS
        value: "red-d9i4417avr4c73a448l0:6379"
      - key: REDIS_ADDR
        value: "red-d9i4417avr4c73a448l0:6379"
      - key: JWT_ACCESS_SECRET
        sync: false