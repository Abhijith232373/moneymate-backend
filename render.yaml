services:
  # ── Internal Redis Cache ──
  - type: keyvalue
    name: moneymate-redis
    region: singapore
    plan: free
    ipAllowList: []

  # ── Auth Service ──
  - type: web
    name: auth-service
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./services/auth/Dockerfile
    envVars:
      - key: PORT
        value: "8081"
      - key: HTTP_PORT
        value: "8081"
      - key: GRPC_PORT
        value: "9091"
      - key: ENVIRONMENT
        value: "production"
      - key: CONFIG_PATH
        value: "./config/config.yaml"
      - key: POSTGRES_HOST
        value: "dpg-d9hk7pl8nd3s73d7cji0-a"
      - key: POSTGRES_PORT
        value: "5432"
      # Using the Render provisioned superuser to guarantee DB connection
      - key: POSTGRES_USER
        value: "superuser"
      - key: POSTGRES_PASSWORD
        value: "41tRCqFMbMCgPwg2K3gB64JECN1Q9ih8"
      - key: POSTGRES_DB
        value: "moneymate_ld80"
      - key: REDIS_ADDR
        value: "red-d9i4417avr4c73a448l0:6379"
      - key: JWT_ACCESS_SECRET
        value: "idekmanjustbesumbullsht"
      - key: JWT_REFRESH_SECRET
        value: "idekmanjustbesumbullsht2"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "moneymate2026@gmail.com"
      - key: SMTP_PASSWORD
        value: "viif uqfa qznf zjia"

  # ── Merchant Service ──
  - type: web
    name: merchant-service
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./services/merchant/Dockerfile
    envVars:
      - key: PORT
        value: "9092"
      - key: ENVIRONMENT
        value: "production"
      - key: CONFIG_PATH
        value: "./config/config.yaml"
      - key: POSTGRES_HOST
        value: "dpg-d9hk7pl8nd3s73d7cji0-a"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        value: "superuser"
      - key: POSTGRES_PASSWORD
        value: "41tRCqFMbMCgPwg2K3gB64JECN1Q9ih8"
      - key: POSTGRES_DB
        value: "moneymate_ld80"
      - key: DB_POOL_MAX_CONNS
        value: "10"
      - key: POSTGRES_MAX_CONNS
        value: "10"
      - key: POOL_MAX_CONNS
        value: "10"

  # ── API Gateway (Public Ingress) ──
  - type: web
    name: api-gateway
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./services/gateway/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: "production"
      - key: CONFIG_PATH
        value: "./config/config.yaml"
      # Gateway targets the internal Auth gRPC port
      - key: SERVICES_AUTH_ADDR
        value: "auth-service:9091"
      - key: AUTH_SERVICE_URL
        value: "auth-service:9091"
      # Gateway targets the internal Merchant HTTP port
      - key: MERCHANT_SERVICE_URL
        value: "merchant-service:9092"
      - key: REDIS_ADDRESS
        value: "red-d9i4417avr4c73a448l0:6379"
      - key: REDIS_ADDR
        value: "red-d9i4417avr4c73a448l0:6379"
      - key: JWT_ACCESS_SECRET
        value: "idekmanjustbesumbullsht"